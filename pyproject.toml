[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "BlueBikes operations planning assistant"
requires-python = ">=3.13"
dependencies = [
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "pandas>=3.1.0",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
